name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test test/ShadowsocksTest.csproj -c Release

      # Costura.Fody merges every dependency into Shadowsocks.exe, so the app
      # ships as that one file. Everything else dotnet publish emits is already
      # inside the exe.
      - name: Publish
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $describe = & { $ErrorActionPreference = 'Continue'; git describe --tags --long --match '[0-9]*' --match 'v[0-9]*' 2>$null }
            if ($describe) { $describe -replace '^v', '' } else { '0.0.0-0-g' + (git rev-parse --short HEAD) }
          }
          Write-Host "Version: $version"
          dotnet publish shadowsocks-csharp/shadowsocks-csharp.csproj -c Release -o out -p:Version=$version
          New-Item -ItemType Directory publish | Out-Null
          Copy-Item out/Shadowsocks.exe publish

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Shadowsocks
          path: publish/*
          if-no-files-found: error

      - name: Package release archive
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: Compress-Archive -Path publish/Shadowsocks.exe -DestinationPath Shadowsocks.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: Shadowsocks.zip
