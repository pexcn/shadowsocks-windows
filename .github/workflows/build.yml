name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test test/ShadowsocksTest.csproj -c Release

      # Costura.Fody merges every dependency into Shadowsocks.exe, the localized
      # strings among them, so the app ships as that one file. Everything else
      # dotnet publish emits is already inside the exe.
      - name: Publish
        shell: pwsh
        run: |
          dotnet publish shadowsocks-csharp/shadowsocks-csharp.csproj -c Release -o out
          New-Item -ItemType Directory publish | Out-Null
          Copy-Item out/Shadowsocks.exe publish

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Shadowsocks
          path: publish/*
          if-no-files-found: error

      - name: Package release archive
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: Compress-Archive -Path publish/Shadowsocks.exe -DestinationPath Shadowsocks.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: Shadowsocks.zip
