name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test test/ShadowsocksTest.csproj -c Release

      # Costura.Fody merges every dependency into Shadowsocks.exe, so the app ships
      # as that executable plus the satellite assemblies in the culture folders --
      # the loose DLLs dotnet publish also emits are already inside the exe.
      - name: Publish
        shell: pwsh
        run: |
          dotnet publish shadowsocks-csharp/shadowsocks-csharp.csproj -c Release -o out
          New-Item -ItemType Directory publish/Shadowsocks | Out-Null
          Copy-Item out/Shadowsocks.exe publish/Shadowsocks
          Get-ChildItem out -Directory |
            Where-Object { Test-Path "$($_.FullName)/Shadowsocks.resources.dll" } |
            Copy-Item -Destination publish/Shadowsocks -Recurse

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Shadowsocks
          path: publish/*
          if-no-files-found: error

      - name: Package release archive
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: Compress-Archive -Path publish/Shadowsocks -DestinationPath Shadowsocks.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: Shadowsocks.zip
